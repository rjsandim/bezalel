name: Validar o pacote
on:
  pull_request:
  workflow_dispatch:
  # Na master, roda chamado pelo workflow de publicação, antes do push do canal.
  workflow_call:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: python3 -B scripts/check_repository.py
      - run: python3 -B -m unittest discover -s tests -v
      - run: git diff --check
  skills:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Sintaxe dos scripts shell da ENV
        run: for script in skills/env/scripts/*.sh; do bash -n "$script"; done
      - name: VPS Deploy
        run: python3 -B -m unittest discover -s skills/vps-deploy/tests -v
      - name: Preparar openpyxl fixado por hash, isolado do Python do sistema
        run: |
          python3 -m venv "$RUNNER_TEMP/workbook"
          "$RUNNER_TEMP/workbook/bin/python" -m pip install --quiet --no-deps --require-hashes -r .github/requirements-workbook.txt
      - name: Roteiro manual em Excel
        run: '"$RUNNER_TEMP/workbook/bin/python" -B -m unittest discover -s skills/development-test-workbook/tests -v'
  env:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Conferir ferramentas do runner, sem instalar
        run: |
          for tool in git jq yq envsubst docker; do
            command -v "$tool" >/dev/null || { echo "Ferramenta ausente: $tool" >&2; exit 1; }
          done
          yq --version | grep -q 'mikefarah/yq' || { echo 'yq de Mike Farah v4 requerido' >&2; exit 1; }
          docker compose version
      - name: Sintaxe dos scripts shell
        run: for script in skills/env/scripts/*.sh; do bash -n "$script"; done
      - name: ENV (Docker simulado; CLI real só para compose config)
        run: python3 -B -m unittest discover -s skills/env/tests -v
